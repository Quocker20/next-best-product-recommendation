# SMLP4Rec model hyperparameters.
# Data, split and evaluation are not read from here any more: the date split is configs/split.yaml
# (rows built by scripts/build_split.py) and training is configs/train.yaml.

# fields the RecBole base class (SequentialRecommender) reads; the data itself never goes through RecBole
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LIST_SUFFIX: _list
ITEM_LIST_LENGTH_FIELD: item_length
NEG_PREFIX: neg_
MAX_ITEM_LIST_LENGTH: 20   # must equal max_history in configs/split.yaml
device: cpu

# model (light config; the paper-style config is too slow on CPU)
n_layers: 2
n_heads: 1                 # read by the original code, unused
hidden_size: 64
hidden_dropout_prob: 0.0   # tuned on {0.0, 0.2} by configs/train.yaml dropout_grid
hidden_act: gelu
layer_norm_eps: 1.0e-12
initializer_range: 0.02
selected_features: []     # hotel clusters have no item attributes
pooling_mode: mean
loss_type: CE
