text><text x="948.0" y="180.0" font-size="19" fill="#5c6166" text-anchor="start" font-weight="400">49,462 first bookings</text><text x="0.0" y="240.0" font-size="17" fill="#5c6166" text-anchor="start" font-weight="400">warm = the guest has at least one earlier booking (L ≥ 1)</text><text x="0.0" y="266.0" font-size="17" fill="#5c6166" text-anchor="start" font-weight="400">first booking = empty history (L = 0, scored separately)</text></svg>